name: CI

on:
  push:
    branches: [main]
    tags: ['*.*.*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: dotnet test tests/Core.Tests -c Release
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npx playwright test
        working-directory: web
      - run: dotnet build src/BepInEx.Il2Cpp -c Release
      - uses: actions/upload-artifact@v7
        with:
          name: UnityRuntimeDebugger
          path: src/BepInEx.Il2Cpp/bin/Release/net6.0/UnityRuntimeDebugger.dll

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches Version
        run: test "$GITHUB_REF_NAME" = "$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)"
      - uses: actions/download-artifact@v8
        with:
          name: UnityRuntimeDebugger
      - run: gh release create "$GITHUB_REF_NAME" UnityRuntimeDebugger.dll --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
